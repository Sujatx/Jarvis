<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="500" fill="#050505" rx="10"/>
    
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#00e5ff" />
        </marker>
        <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Nodes -->
    <!-- Input -->
    <rect x="50" y="200" width="120" height="60" rx="5" fill="url(#boxGrad)" stroke="#333"/>
    <text x="110" y="235" fill="#fff" font-family="Consolas" font-size="14" text-anchor="middle">USER INPUT</text>
    <text x="110" y="250" fill="#888" font-family="Consolas" font-size="10" text-anchor="middle">(Voice/Text)</text>

    <!-- Ear -->
    <rect x="220" y="150" width="140" height="60" rx="5" fill="url(#boxGrad)" stroke="#00e5ff"/>
    <text x="290" y="185" fill="#00e5ff" font-family="Consolas" font-size="14" text-anchor="middle">EAR (STT)</text>
    <text x="290" y="200" fill="#888" font-family="Consolas" font-size="10" text-anchor="middle">Faster-Whisper</text>

    <!-- Conductor -->
    <rect x="410" y="200" width="160" height="100" rx="5" fill="url(#boxGrad)" stroke="#fff" stroke-dasharray="5,5"/>
    <text x="490" y="245" fill="#fff" font-family="Consolas" font-size="16" text-anchor="middle">CONDUCTOR</text>
    <text x="490" y="265" fill="#888" font-family="Consolas" font-size="10" text-anchor="middle">Event-Driven Queue</text>

    <!-- Brain -->
    <rect x="620" y="200" width="140" height="60" rx="5" fill="url(#boxGrad)" stroke="#00e5ff"/>
    <text x="690" y="235" fill="#00e5ff" font-family="Consolas" font-size="14" text-anchor="middle">BRAIN (LLM)</text>
    <text x="690" y="250" fill="#888" font-family="Consolas" font-size="10" text-anchor="middle">Groq Llama 3.3</text>

    <!-- Actions -->
    <rect x="420" y="360" width="140" height="60" rx="5" fill="url(#boxGrad)" stroke="#333"/>
    <text x="490" y="395" fill="#fff" font-family="Consolas" font-size="14" text-anchor="middle">EXECUTOR</text>
    <text x="490" y="410" fill="#888" font-family="Consolas" font-size="10" text-anchor="middle">OS &amp; Web Skills</text>

    <!-- Mouth -->
    <rect x="220" y="250" width="140" height="60" rx="5" fill="url(#boxGrad)" stroke="#00e5ff"/>
    <text x="290" y="285" fill="#00e5ff" font-family="Consolas" font-size="14" text-anchor="middle">MOUTH (TTS)</text>
    <text x="290" y="300" fill="#888" font-family="Consolas" font-size="10" text-anchor="middle">Piper Engine</text>

    <!-- Paths -->
    <line x1="170" y1="215" x2="210" y2="185" stroke="#333" marker-end="url(#arrowhead)"/>
    <line x1="170" y1="245" x2="400" y2="245" stroke="#333" marker-end="url(#arrowhead)"/>
    <line x1="360" y1="180" x2="410" y2="210" stroke="#333" marker-end="url(#arrowhead)"/>
    <line x1="570" y1="235" x2="610" y2="235" stroke="#00e5ff" marker-end="url(#arrowhead)"/>
    <path d="M 690 260 L 690 330 L 490 330 L 490 350" fill="none" stroke="#00e5ff" marker-end="url(#arrowhead)"/>
    <line x1="490" y1="360" x2="490" y2="310" stroke="#333" marker-end="url(#arrowhead)"/>
    <line x1="410" y1="280" x2="360" y2="280" stroke="#333" marker-end="url(#arrowhead)"/>
</svg>
